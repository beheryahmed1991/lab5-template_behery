# Local image from docker-compose.yml; set the registry repository when publishing.
image:
  repository: lab3-reservation-service
  tag: local

service:
  port: 8070
  targetPort: 8070

# This Secret must provide DATABASE_URL for the reservations database.
# Create it in the same namespace as this Helm release.
envFrom:
  - secretRef:
      name: reservation-service-db
